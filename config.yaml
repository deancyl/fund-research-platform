# config.yaml — 全局配置文件
# 所有策略参数、LLM设置、数据更新间隔均从此文件读取

# ─── 数据源 ─────────────────────────────────────────────────────────────────
data:
  primary: akshare
  fallback: eastmoney
  cache_dir: .data
  max_age_hours: 24

# ─── LLM / AI ───────────────────────────────────────────────────────────────
llm:
  provider: deepseek
  api_base: https://api.deepseek.com/v1
  model: deepseek-chat
  temperature: 0.1
  max_tokens: 4096
  fallback: ollama  # 离线备用

# ─── 策略参数 ───────────────────────────────────────────────────────────────
strategies:
  factor_momentum:
    enabled: true
    top_n: 3
    lookback_days: 21
    rebalance_day: 1  # 每月1日调仓

  pe_pb_band:
    enabled: true
    pe_buy_threshold: 10.5
    pe_sell_threshold: 14.5
    pb_buy_threshold: 1.2
    pb_sell_threshold: 1.7

  dividend_timing:
    enabled: true
    score_buy_threshold: 25
    score_sell_threshold: 75
    rsi_period: 20
    ma_period: 80
    boll_period: 20

  grid_hurst:
    enabled: true
    grid_spacing_pct: 0.05
    grid_layers: 5
    hurst_veto_threshold: 0.60

# ─── 风险控制 ───────────────────────────────────────────────────────────────
risk:
  max_single_position_pct: 0.20
  max_portfolio_drawdown_pct: 0.20
  max_strategy_drawdown_pct: 0.15
  sharpe_attenuation:
    beta_low: 0.9    # 回测夏普 < 0.5
    beta_mid: 0.7    # 0.5-1.0
    beta_high: 0.5   # 1.0-1.5
    beta_extreme: 0.25  # > 2.0

# ─── 市场状态 ───────────────────────────────────────────────────────────────
regime:
  hmm_states: 3
  hmm_features:
    - return_1d
    - return_5d
    - volatility_20d
    - rsi_14
    - volume_ratio
  recheck_interval_days: 7  # 每周重检

# ─── TUI ────────────────────────────────────────────────────────────────────
tui:
  theme: dark
  refresh_interval_seconds: 5
  log_max_lines: 100
  colors:
    up: red      # 中国市场惯例: 红涨
    down: green  # 绿跌

# ─── Web ────────────────────────────────────────────────────────────────────
web:
  host: 127.0.0.1
  port: 8000
  cors_origins: ["http://localhost:5173"]
